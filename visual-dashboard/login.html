<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RIYU 森林安全工作台登录">
  <title>登录 · RIYU 森林安全工作台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/login.css?v=20260804-1">
</head>
<body>
  <main class="login-shell">
    <section class="login-intro" aria-labelledby="loginTitle">
      <a class="login-brand" href="/login" aria-label="RIYU 登录首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" role="img">
            <path class="leaf-main" d="M39.6 7.4C25.8 7.7 14.2 13.2 9.8 23.1c-3.2 7.2-.7 14.4 5.3 17.4 6.8 3.4 15.1.1 18.3-7.5 3.1-7.5 1.1-15.3 6.2-25.6Z"/>
            <path class="leaf-vein" d="M13.5 35.4c6.6-8.9 12.9-14.6 21.2-20.6M22 27.6c.2-4.3-.4-7.1-1.7-9.6M24.1 25.7c4.1-.3 7.1.2 9.8 1.4"/>
          </svg>
        </span>
        <span><strong>RIYU</strong><small>FOREST SECURITY STUDIO</small></span>
      </a>
      <div class="intro-copy">
        <p>FOREST SECURITY CONSOLE</p>
        <h1 id="loginTitle">回到你的安全工作台</h1>
        <span>账号任务、运行状态与持久化数据都在这里安静等你。</span>
      </div>
    </section>

    <section class="login-panel" aria-label="登录表单">
      <form class="login-form" action="/login" method="post">
        <div class="form-heading">
          <p>欢迎回来</p>
          <h2>登录 RIYU</h2>
        </div>
        <div class="login-error" id="loginError" role="alert" hidden>
          用户名或密码不正确，请重新输入。
        </div>
        <label>
          <span>用户名</span>
          <input name="username" type="text" autocomplete="username" required autofocus>
        </label>
        <label>
          <span>密码</span>
          <span class="password-field">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button id="togglePassword" type="button" aria-label="显示密码" title="显示密码">◎</button>
          </span>
        </label>
        <input id="nextPath" name="next" type="hidden" value="/">
        <button class="submit-button" type="submit">进入工作台 <span aria-hidden="true">→</span></button>
        <small>登录状态将在此设备保留 7 天</small>
      </form>
    </section>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById("loginError").hidden = params.get("error") !== "1";
    document.getElementById("nextPath").value = params.get("next") || "/";
    const password = document.getElementById("password");
    const toggle = document.getElementById("togglePassword");
    toggle.addEventListener("click", () => {
      const showing = password.type === "text";
      password.type = showing ? "password" : "text";
      toggle.textContent = showing ? "◎" : "◉";
      toggle.setAttribute("aria-label", showing ? "显示密码" : "隐藏密码");
    });
  </script>
</body>
</html>
